name: EMart24 Restock Monitor

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pywebpush
      - name: Check registered watch count
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT
                          COUNT(*),
                          COUNT(*) FILTER (
                              WHERE enabled = TRUE
                                AND latitude IS NOT NULL
                                AND longitude IS NOT NULL
                                AND radius_km BETWEEN 1 AND 20
                          )
                      FROM push_watch_items
                  """)
                  total, eligible = cur.fetchone()

          print("등록된 전체 알림 상품:", total)
          print("감시 조건을 만족하는 상품:", eligible)
          PY
      - name: Run restock monitor
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          python -c "from app import run_push_notification_cycle; print(run_push_notification_cycle())"
      - name: Send one test push
        if: github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
        run: |
          python - <<'PY'
          import os
          import psycopg
          from app import send_restock_push

          with psycopg.connect(os.environ["DATABASE_URL"]) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      SELECT s.endpoint, s.p256dh, s.auth
                      FROM push_subscriptions s
                      JOIN push_watch_items w
                        ON w.subscription_id = s.id
                      WHERE w.enabled = TRUE
                      ORDER BY w.id DESC
                      LIMIT 1
                  """)
                  row = cur.fetchone()

          if row is None:
              print("테스트 대상 구독 없음")
          else:
              endpoint, p256dh, auth = row
              subscription = {
                  "endpoint": endpoint,
                  "keys": {"p256dh": p256dh, "auth": auth}
              }
              status = send_restock_push(
                  subscription,
                  "🔔 푸시 알림 테스트",
                  "테스트 발송",
                  0
              )
              print("테스트 푸시 응답 코드:", status)
          PY
