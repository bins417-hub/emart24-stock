<style>
*{box-sizing:border-box}
:root{
  --bg:#080a0c;
  --panel:#0f1215;
  --panel2:#15191e;
  --panel3:#1b2026;
  --line:#252b32;
  --text:#f5f6f7;
  --muted:#89919c;
  --yellow:#ffd522;
  --green:#18e36b;
  --green-bg:#082b18;
  --red:#ff5058;
  --red-bg:#321013;
}
html{background:var(--bg)}
body{
  margin:0;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -150px,#1a2026 0,#080a0c 420px);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.w{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:18px 13px 60px;
}
.c{
  background:linear-gradient(145deg,#101419,#0c0f12);
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  margin-bottom:13px;
}
h1{
  margin:0 0 5px;
  font-size:27px;
  letter-spacing:-1.2px;
}
h1 span{
  color:var(--yellow)!important;
  font-size:11px!important;
  border:1px solid #423b13;
  background:#211e0d;
  padding:5px 8px;
  border-radius:20px;
  vertical-align:middle;
}
h2{
  margin:0 0 15px;
  font-size:19px;
  letter-spacing:-.6px;
}
.row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
}
input,select,button{
  min-height:48px;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  padding:0 14px;
  outline:none;
}
input::placeholder{color:#6f7781}
input:focus,select:focus{border-color:#5d6570}
input{flex:1;min-width:150px}
select{color-scheme:dark}
button{
  background:var(--yellow);
  color:#111;
  border-color:var(--yellow);
  font-weight:800;
  cursor:pointer;
}
button:active{transform:scale(.98)}
.secondary{
  color:#c9ced4;
  background:var(--panel2);
  border-color:var(--line);
}
.active{
  background:var(--yellow);
  color:#111;
  border-color:var(--yellow);
}
#locationBtn{
  background:var(--panel3);
  color:var(--yellow);
  border:1px solid #414852;
}
#refreshBtn{
  background:var(--panel3);
  color:#fff;
  border-color:#343b44;
}
#locmsg,#msg{margin:10px 2px 0}
.muted{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}
.p{
  position:relative;
  margin:9px 0;
  padding:17px 42px 17px 16px;
  border-radius:17px;
  border:1px solid var(--line);
  background:linear-gradient(145deg,#15191e,#101317);
  cursor:pointer;
}
.p:after{
  content:"›";
  position:absolute;
  right:17px;
  top:50%;
  transform:translateY(-50%);
  font-size:30px;
  color:#68717d;
}
.p:active{
  border-color:var(--yellow);
  transform:scale(.995);
}
.p b{
  display:block;
  font-size:16px;
  margin-bottom:4px;
}
#summary{
  margin:14px 0 4px;
  padding:12px 13px;
  background:#11151a;
  border:1px solid #20262d;
  border-radius:13px;
}
.store{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-top:10px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(145deg,#13171c,#0e1114);
}
.store>div:first-child{
  flex:1;
  min-width:0;
}
.store b{
  font-size:16px;
  letter-spacing:-.4px;
}
.store .muted{
  display:block;
  margin-top:4px;
}
.qty{
  flex:none;
  min-width:88px;
  padding:10px 11px;
  border-radius:13px;
  text-align:center;
  font-weight:900;
  white-space:nowrap;
}
.yes{
  color:var(--green);
  background:var(--green-bg);
  border:1px solid #0d7137;
  font-size:17px;
}
.zero{
  color:#c3c8ce;
  background:#1a1f25;
  border:1px solid #303740;
  font-size:13px;
}
.unknown{
  color:#b8bec6;
  background:#1a1f25;
  border:1px solid #303740;
  font-size:12px;
}
.dist{
  display:inline-block;
  margin-top:7px;
  padding:4px 7px;
  border-radius:8px;
  background:#20252c;
  color:#aeb5be;
  font-size:12px;
  font-weight:700;
}
.change{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  align-items:center;
  margin-top:8px;
  font-size:12px;
}
.up{
  padding:4px 7px;
  border-radius:8px;
  color:var(--green);
  background:var(--green-bg);
  font-weight:900;
}
.down{
  padding:4px 7px;
  border-radius:8px;
  color:var(--red);
  background:var(--red-bg);
  font-weight:900;
}
.live{
  color:var(--green);
  font-size:12px;
  font-weight:900;
}
.live:not(:empty):before{
  content:"● ";
}
.radius-wrap{
  display:flex;
  width:100%;
  gap:6px;
  margin-top:2px;
  overflow-x:auto;
  scrollbar-width:none;
}
.radius-wrap::-webkit-scrollbar{display:none}
.radius-btn{
  min-width:64px;
  min-height:43px;
  padding:0 13px;
  flex:1 0 auto;
  border-radius:13px;
}
.radius-btn.active{
  background:var(--yellow);
  color:#111;
  border-color:var(--yellow);
}

@media(max-width:600px){

'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
}[m]));

let stores=[];
let filter='stock';

let myLon=null;
let selectedProduct=null;
let timer=null;

let changeStats={};
let lastRefresh=null;

function km(lat1,lon1,lat2,lon2){
    const R=6371,rad=x=>x*Math.PI/180;
    const dLat=rad(lat2-lat1);
    const dLon=rad(lon2-lon1);
    const a=Math.sin(dLat/2)**2+
        Math.cos(rad(lat1))*Math.cos(rad(lat2))*
        Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(a));
}

function getLocation(){
    if(!navigator.geolocation){
        $('locmsg').textContent='이 브라우저는 위치 기능을 지원하지 않습니다.';
        return;
    }

    $('locmsg').textContent='현재 위치 확인 중...';

    navigator.geolocation.getCurrentPosition(
        p=>{
            myLat=p.coords.latitude;
            myLon=p.coords.longitude;
            $('locmsg').textContent='현재 위치의 지역을 확인 중...';
            detectMyArea();
        },
        ()=>{
            $('locmsg').textContent='위치 권한을 허용하지 않았거나 위치를 가져오지 못했습니다.';
        },
        {enableHighAccuracy:true,timeout:10000}
    );
}

async function detectMyArea() {
    try {
        const url = 'https://nominatim.openstreetmap.org/reverse?' +
            'format=json&zoom=10&addressdetails=1&lat=' +
            encodeURIComponent(myLat) +
            '&lon=' + encodeURIComponent(myLon);

        const response = await fetch(url);
        if (!response.ok) throw new Error('주소 조회 실패');

        const data = await response.json();
        const addr = data.address || {};

        const city = addr.city || addr.province || addr.state || '';
        const district = addr.city_district || addr.borough ||
            addr.county || '';

        if (!city || !district) {
            throw new Error('행정구역 확인 실패');
        }

        const cityOptions = Array.from($('a1').options);
        const matched = cityOptions.find(option =>
            city.includes(option.value) || option.value.includes(city)
        );

        if (!matched) {
            throw new Error('현재 지역은 검색 지원 지역이 아닙니다');
        }

        $('a1').value = matched.value;
        $('a2').value = district;
        $('sort').value = 'distance';

        $('locmsg').textContent =
            '현재 위치 적용: ' + matched.value + ' ' + district;

        if (selectedProduct) {
            loadInventory(false);
        } else {
            render();
        }
    } catch (error) {
        $('locmsg').textContent =
            '위치는 확인했지만 지역 자동 설정에 실패했습니다. 지역을 직접 선택해주세요.';
        render();
    }
}


/* V9 FAVORITES 135-2 */
const FAVORITES_KEY = 'emart24-v9-favorites';

function getFavorites(){
    try{
        const data=JSON.parse(localStorage.getItem(FAVORITES_KEY)||'[]');
        return Array.isArray(data)?data:[];
    }catch(e){
        return [];
    }
}

function isFavorite(plu){
    return getFavorites().some(x=>String(x.plu)===String(plu));
}

function toggleFavorite(product){
    let items=getFavorites();
    const key=String(product.plu);

    if(items.some(x=>String(x.plu)===key)){
        items=items.filter(x=>String(x.plu)!==key);
    }else{
        items.push({
            plu:product.plu,
            name:product.name,
            price:product.price
        });
    }

    try{
        localStorage.setItem(FAVORITES_KEY,JSON.stringify(items));
    }catch(e){
        alert('즐겨찾기를 저장할 수 없습니다.');
    }
}

function favoriteHeartSVG(active){

        'stroke="currentColor" stroke-width="2" '+
        'stroke-linecap="round" stroke-linejoin="round" '+

        '<path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>'+

}

let alertPreviousStock = new Map();
let alertTrackingPlu = null;

function showStockAlert(message){
    let box = document.getElementById('stockAlert135');
    if(!box){
        box = document.createElement('div');
        box.id = 'stockAlert135';
        box.setAttribute('role','status');
        box.setAttribute('aria-live','polite');
        document.body.appendChild(box);
    }

    const item = document.createElement('div');
    item.className = 'stock-alert-item';

    const text = document.createElement('span');
    text.textContent = '🔔 ' + message;

    const close = document.createElement('button');
    close.type = 'button';
    close.textContent = '×';
    close.setAttribute('aria-label','알림 닫기');
    close.addEventListener('click',()=>item.remove());

    item.append(text,close);
    box.prepend(item);

    while(box.children.length > 4){
        box.lastElementChild.remove();
    }
}

function checkFavoriteRestock(product, list){
    if(!product || !Array.isArray(list)) return;

    const plu = String(product.plu);

    if(alertTrackingPlu !== plu){
        alertPreviousStock.clear();
        alertTrackingPlu = plu;
    }

    const enabled = isFavorite(plu) && isFavoriteAlertEnabled(plu);
    const next = new Map();

    for(const store of list){
        if(store.stockStatus !== 'known') continue;

        const biz = String(store.bizNo);
        const qty = Number(store.quantity) || 0;
        const key = plu + ':' + biz;

        next.set(key,qty);

        if(enabled &&
           alertPreviousStock.has(key) &&
           alertPreviousStock.get(key) === 0 &&
           qty > 0){
            showStockAlert(
                product.name + ' · ' +
                store.name + ' · 재고 ' + qty + '개 입고!'
            );
        }
    }

    alertPreviousStock = next;
}

function updateFavoriteHearts(){
    document.querySelectorAll('.fav-heart').forEach(btn=>{
        const active=isFavorite(btn.dataset.favPlu);
        btn.innerHTML=favoriteHeartSVG(active);
        btn.classList.toggle('is-favorite',active);
    });
}


/* V9 FAVORITE ALERT SETTINGS 135-3 */
const FAVORITE_ALERTS_KEY = 'emart24-v9-favorite-alerts';

function getFavoriteAlerts(){
    try {
        const data = JSON.parse(localStorage.getItem(FAVORITE_ALERTS_KEY) || '{}');
        return data && typeof data === 'object' && !Array.isArray(data) ? data : {};
    } catch(e) {
        return {};
    }
}

function isFavoriteAlertEnabled(plu){
    return getFavoriteAlerts()[String(plu)] === true;
}

function toggleFavoriteAlert(plu){
    const settings = getFavoriteAlerts();
    const key = String(plu);
    settings[key] = !settings[key];

    try {
        localStorage.setItem(FAVORITE_ALERTS_KEY, JSON.stringify(settings));
        renderFavorites();
    } catch(e) {
        alert('알림 설정을 저장할 수 없습니다.');
    }
}

function renderFavorites(){
    let wrap=document.getElementById('favorites135');

    if(!wrap){
        wrap=document.createElement('section');
        wrap.id='favorites135';
        const productList=$('pl');
        productList.parentNode.insertBefore(wrap,productList);
    }

    const items=getFavorites();

    wrap.innerHTML=
        '<div class="favorites-heading">'+
            '<strong>♥ 내 즐겨찾기</strong>'+
            '<span>'+items.length+'개 상품</span>'+
        '</div>'+
        (items.length
            ? '<div class="favorites-items">'+items.map(p=>
                '<div class="favorite-entry">'+
                    '<button type="button" class="favorite-item" data-favorite-plu="'+E(String(p.plu))+'">'+
                        '<span>'+E(p.name)+'</span>'+
                        '<small>'+E(String(p.plu))+'</small>'+
                    '</button>'+
                    '<button type="button" class="favorite-alert-btn" data-alert-plu="'+E(String(p.plu))+'" '+
                        'aria-label="재입고 알림 설정" aria-pressed="'+(isFavoriteAlertEnabled(p.plu)?'true':'false')+'">'+
                        (isFavoriteAlertEnabled(p.plu)?'🔔':'🔕')+
                    '</button>'+
                '</div>'
              ).join('')+'</div>'
            : '<p class="favorites-empty">관심 상품의 ♡ 버튼을 눌러 저장해보세요.</p>');

    wrap.querySelectorAll('.favorite-alert-btn').forEach(btn=>{
        btn.addEventListener('click',()=>{
            toggleFavoriteAlert(btn.dataset.alertPlu);
        });
    });

    wrap.querySelectorAll('.favorite-item').forEach(btn=>{
        btn.addEventListener('click',()=>{
            const product=getFavorites().find(
                p=>String(p.plu)===btn.dataset.favoritePlu
            );
            if(product) selectProduct(product);
        });
    });
}

        const d=await r.json();

        $('msg').textContent='검색 중 오류가 발생했습니다.';
    }

/* V9 MULTI FAVORITE WATCH 135-5 */
const favoriteWatchPrevious = new Map();
let favoriteWatchBusy = false;
let favoriteWatchScope = '';

async function watchFavoriteStocks(){
    if(favoriteWatchBusy || document.hidden) return;

    const products = getFavorites().filter(
        p => isFavoriteAlertEnabled(p.plu)
    );

    if(!products.length) return;

    const radius = Number($('radius').value);
    const useGps = myLat !== null && myLon !== null && radius > 0;

    const city = $('a1').value;
    const district = $('a2').value.trim();

    const regions = city === '서울특별시' &&
        myLat !== null && myLon !== null
        ? (nearbyRegions[district] || [city + ':' + district])
        : [city + ':' + district];

    const scope = useGps
        ? 'gps:' + myLat.toFixed(4) + ':' + myLon.toFixed(4) + ':' + radius
        : 'region:' + regions.join(',');

    if(scope !== favoriteWatchScope){
        favoriteWatchPrevious.clear();
        favoriteWatchScope = scope;
    }

    favoriteWatchBusy = true;

    try{
        for(const product of products){
            if(document.hidden) break;

            const plu = String(product.plu);

            const url = useGps
                ? '/api/inventory/gps?plu=' + encodeURIComponent(plu) +
                  '&lat=' + encodeURIComponent(myLat) +
                  '&lon=' + encodeURIComponent(myLon) +
                  '&radius=' + encodeURIComponent(radius)
                : '/api/inventory/region?plu=' + encodeURIComponent(plu) +
                  '&regions=' + encodeURIComponent(regions.join(','));

            try{
                const response = await fetch(url);
                if(!response.ok) continue;

                const data = await response.json();
                if(!Array.isArray(data.stores)) continue;

                const keyPrefix = scope + ':' + plu + ':';

                for(const store of data.stores){
                    if(store.stockStatus !== 'known') continue;

                    const key = keyPrefix + String(store.bizNo);
                    const qty = Number(store.quantity);

                    if(!Number.isFinite(qty)) continue;

                    const previous = favoriteWatchPrevious.get(key);

                    if(previous === 0 && qty > 0 &&
                       isFavorite(plu) &&
                       isFavoriteAlertEnabled(plu)){
                        showStockAlert(
                            product.name + ' · ' +
                            store.name + ' · 재고 ' + qty + '개 입고!'
                        );
                    }

                    favoriteWatchPrevious.set(key,qty);
                }
            }catch(e){
                console.warn('즐겨찾기 재고 감시 실패:',plu,e);
            }
        }
    }finally{
        favoriteWatchBusy = false;
    }
}

setInterval(watchFavoriteStocks,60000);
document.addEventListener('visibilitychange',()=>{
    if(!document.hidden) watchFavoriteStocks();
});

let inventoryRequestId = 0;

async function loadInventory(isAuto=false){
    const requestId = ++inventoryRequestId;
    if(!selectedProduct) return;

    if(!isAuto){
        stores = [];
        render();
        $('sl').textContent='조회 중...';
    }

    const p=selectedProduct;

    const city = $('a1').value;
    const district = $('a2').value.trim();
    const areas = city === '서울특별시' && myLat != null && myLon != null
        ? (nearbyDistricts[district] || [district])
        : [district];

    const regions = city === '서울특별시' &&
        myLat != null && myLon != null
        ? (nearbyRegions[district] || [city + ':' + district])
        : [city + ':' + district];

    const radius = Number($('radius').value);
    const useGps = myLat != null && myLon != null && radius > 0;

    const u = useGps
        ? '/api/inventory/gps?plu=' + encodeURIComponent(p.plu) +
          '&lat=' + encodeURIComponent(myLat) +
          '&lon=' + encodeURIComponent(myLon) +
          '&radius=' + encodeURIComponent(radius)
        : '/api/inventory/region?plu=' + encodeURIComponent(p.plu) +
          '&regions=' + encodeURIComponent(regions.join(','));

    try{
        const r=await fetch(u);
        const d=await r.json();

        if(requestId !== inventoryRequestId) return;

        if(!r.ok){
            $('liveStatus').textContent='조회 오류';
            if(!isAuto) $('sl').textContent='오류: '+d.detail;
            return;
        }

        updateChanges(d.stores);

        stores=d.stores;
        lastRefresh=new Date();

        sync();
        render();
    }catch(e){
        $('liveStatus').textContent='조회 실패';
    }
}

function showRestockToast(store,delta){
    const el=$('restockToast');
    el.innerHTML='<strong>🔥 새 입고 감지!</strong>'+
        E(store.name)+' · +'+delta+'개 · 현재 '+store.quantity+'개';
    el.classList.add('show');

    if(toastTimer) clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>el.classList.remove('show'),5000);
}

function updateChanges(newStores){
    const now=new Date();

    newStores.forEach(x=>{
        if(x.stockStatus!=='known') return;

        const key=x.bizNo;
        const current=Number(x.quantity);

        if(!(key in changeStats)){
            changeStats[key]={
                up:0,
                down:0,
                lastChange:null,
                lastDelta:0
            };
        }

        if(key in previousQty){
            const old=previousQty[key];
            const delta=current-old;

            if(delta>0){
                changeStats[key].up+=delta;
                changeStats[key].lastDelta=delta;
                changeStats[key].lastChange=now;
                showRestockToast(x,delta);
            }else if(delta<0){
                changeStats[key].down+=Math.abs(delta);
                changeStats[key].lastDelta=delta;
                changeStats[key].lastChange=now;
            }
        }

        previousQty[key]=current;
    });
}

function distanceOf(x){
    if(myLat===null||myLon===null||!x.lat||!x.lon) return null;
    return km(myLat,myLon,Number(x.lat),Number(x.lon));
}


/* V9 NAVER WALK ROUTE 132 */
function openNaverWalkRoute(store) {
    const lat = Number(store.lat);
    const lon = Number(store.lon);

    if (!Number.isFinite(lat) || !Number.isFinite(lon) ||
        lat <= 0 || lon <= 0) {
        alert('이 매장의 위치 정보가 없습니다.');
        return;
    }

    const name = String(store.name || '이마트24');
    const mobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

    if (mobile) {
        const params = new URLSearchParams({
            dlat: String(lat),
            dlng: String(lon),
            dname: name,
            appname: window.location.hostname || 'localhost'
        });

        if (myLat !== null && myLon !== null) {
            params.set('slat', String(myLat));
            params.set('slng', String(myLon));
            params.set('sname', '내 위치');
        }

        window.location.href = 'nmap://route/walk?' + params.toString();
    } else {
        const query = encodeURIComponent(name + ' ' + (store.address || ''));
        window.open(
            'https://map.naver.com/p/search/' + query,
            '_blank',
            'noopener,noreferrer'
        );
    }
}

document.addEventListener('click', function(e) {
    const btn = e.target.closest('.naver-walk-btn');
    if (!btn) return;

    e.preventDefault();
    e.stopPropagation();

    const store = stores.find(
        x => String(x.bizNo) === btn.dataset.routeBiz
    );

    if (store) openNaverWalkRoute(store);
});

function render(){
    let a=[...stores];

    if(filter==='stock'){
        a=a.filter(x=>x.stockStatus==='known'&&x.quantity>0);
    }

    if(filter==='restock'){
        const cutoff=Date.now()-(24*60*60*1000);
        a=a.filter(x=>x.lastRestock && new Date(x.lastRestock).getTime()>=cutoff && x.stockStatus==='known' && x.quantity>0);
        a.sort((x,y)=>new Date(y.lastRestock)-new Date(x.lastRestock));
    }

    const radius=Number($('radius').value);

    if(radius>0){
        if(myLat===null||myLon===null){
            $('locmsg').textContent='반경 검색을 사용하려면 먼저 내 위치 사용을 눌러주세요.';
        }else{
            a=a.filter(x=>{
                const d=distanceOf(x);
                return d!==null&&d<=radius;
            });
        }
    }

    if(filter==='restock'){
        a.sort((x,y)=>new Date(y.lastRestock)-new Date(x.lastRestock));
    }
    else if($('sort').value==='qty'){
        a.sort((x,y)=>(y.quantity??-1)-(x.quantity??-1));
    }
    else if($('sort').value==='distance'){
        if(myLat===null){
            $('locmsg').textContent='먼저 내 위치 사용 버튼을 눌러주세요.';
            $('sort').value='qty';
            a.sort((x,y)=>(y.quantity??-1)-(x.quantity??-1));
        }else{
            a.sort((x,y)=>(distanceOf(x)??99999)-(distanceOf(y)??99999));
        }
    }
    else{
        a.sort((x,y)=>x.name.localeCompare(y.name,'ko'));
    }

    const positive=a.filter(
        x=>x.stockStatus==='known'&&x.quantity>0
    ).length;

    const zero=a.filter(
        x=>x.stockStatus==='known'&&x.quantity===0
    ).length;

    const unknown=a.filter(
        x=>x.stockStatus==='unknown'
    ).length;

    $('statTotal').textContent=a.length;
    $('statStock').textContent=positive;
    $('statZero').textContent=zero;
    $('statUnknown').textContent=unknown;

    let summaryText='실시간 재고 현황';

    if(lastRefresh){
        summaryText+=' · 마지막 조회 '+
            lastRefresh.toLocaleTimeString('ko-KR',{
                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            });
    }

    $('summary').textContent=summaryText;

    updateStoreMap(a);

    if(selectedProduct){
        checkFavoriteRestock(selectedProduct,stores);
    }

    if(!a.length){
        $('sl').innerHTML='<p>조건에 맞는 매장이 없습니다.</p>';
        return;
    }

    $('sl').innerHTML=a.map(x=>{
        let t,c;

        if(x.stockStatus==='unknown'){
            t='수량 미확인';
            c='unknown';
        }else if(x.quantity>0){
            t='재고 '+x.quantity+'개';
            c='yes';
        }else{
            t='품절 (0개)';
            c='zero';
        }

        const d=distanceOf(x);

        const ds=d===null?'':(
            '<div class="dist">현재 위치에서 약 '+
            (d<1?Math.round(d*1000)+'m':d.toFixed(1)+'km')+
            '</div>'
        );

        const st=changeStats[x.bizNo];

        let change='';

        if(st){
            const parts=[];

            if(st.up>0){
                parts.push('<span class="up">▲ 증가 +'+st.up+'</span>');
            }

            if(st.down>0){
                parts.push('<span class="down">▼ 감소 -'+st.down+'</span>');
            }

            if(st.lastChange){
                parts.push(
                    '<span class="muted">최근 변동 '+
                    st.lastChange.toLocaleTimeString('ko-KR',{
                        hour:'2-digit',
                        minute:'2-digit',
                        second:'2-digit'
                    })+
                    '</span>'
                );
            }

            if(parts.length){
                change='<div class="change">'+parts.join(' · ')+'</div>';
            }
        }

        let restock='';
        if(x.lastRestock){
            const rt=new Date(x.lastRestock);
            const mins=Math.max(0,Math.floor((Date.now()-rt.getTime())/60000));
            let ago=mins<1?'방금':mins<60?mins+'분 전':Math.floor(mins/60)+'시간 전';
            restock='<div class="restock">🔥 최근 입고 · '+ago+
                ' · '+x.fromQty+' → '+x.toQty+'개 · ▲ +'+x.lastIncrease+
                '</div>';
        }

        return '<div class="store" data-biz="'+E(String(x.bizNo))+'">'+
            '<div>'+
                '<b>'+E(x.name)+'</b>'+
                '<div class="muted">'+E(x.address)+'</div>'+
                ds+
                restock+
                change+
                (Number.isFinite(Number(x.lat)) &&
                 Number.isFinite(Number(x.lon)) &&
                 Number(x.lat) > 0 && Number(x.lon) > 0
                    ? '<button type="button" class="naver-walk-btn" data-route-biz="'+E(String(x.bizNo))+'">🚶 네이버 길안내</button>'
                    : '')+
            '</div>'+
            '<div class="qty '+c+'">'+E(t)+'</div>'+
        '</div>';
    }).join('');
}


let storeMap = null;
let rangeCircle = null;
let myMapMarker = null;
let storeMarkers = null;
let storeMarkerByBiz = {};
let mapInitialViewDone = false;

function updateStoreMap(list) {
    if (typeof L === 'undefined') {
        $('mapInfo').textContent = '지도 라이브러리를 불러오지 못했습니다.';
        return;
    }

    if (!storeMap) {
        storeMap = L.map('storeMap', {zoomControl: false}).setView([37.5665, 126.9780], 11);

        /* V9 MAP DAY NIGHT 129 */
        const mapDayLayer = L.tileLayer(
            'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
            {
                maxZoom: 19,
                attribution: '&copy; OpenStreetMap contributors'
            }
        );

        const mapNightLayer = L.tileLayer(
            'https://tiles.stadiamaps.com/tiles/alidade_smooth_dark/{z}/{x}/{y}{r}.png',
            {
                maxZoom: 19,
                attribution: '&copy; Stadia Maps &copy; OpenMapTiles &copy; OpenStreetMap contributors'
            }
        );

        let currentMapLayer = null;

        function updateMapTheme() {
            const isDark = document.documentElement.dataset.theme === 'dark';
            const nextLayer = isDark ? mapNightLayer : mapDayLayer;

            if (currentMapLayer === nextLayer) return;

            if (currentMapLayer) {
                storeMap.removeLayer(currentMapLayer);
            }

            nextLayer.addTo(storeMap);
            nextLayer.bringToBack();
            currentMapLayer = nextLayer;
        }

        updateMapTheme();

        const mapThemeObserver = new MutationObserver(updateMapTheme);
        mapThemeObserver.observe(document.documentElement, {
            attributes: true,
            attributeFilter: ['data-theme']
        });


        storeMarkers = L.layerGroup().addTo(storeMap);

        // 확대·축소 버튼을 지도 오른쪽에 배치
        // 세로 드래그 확대·축소 슬라이더
        const ZoomSlider = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function() {
                const wrap = L.DomUtil.create('div', 'map-zoom-slider');
                wrap.innerHTML = `
                    <span class="zoom-label">+</span>
                    <input type="range" class="zoom-range"
                        min="8" max="17" step="1"
                        orient="vertical"
                        aria-label="지도 확대 축소">
                    <span class="zoom-label">−</span>
                `;

                const slider = wrap.querySelector('input');
                slider.value = storeMap.getZoom();

                L.DomEvent.disableClickPropagation(wrap);
                L.DomEvent.disableScrollPropagation(wrap);

                slider.addEventListener('input', function() {
                    storeMap.setZoom(Number(this.value));
                });

                storeMap.on('zoomend', function() {
                    slider.value = storeMap.getZoom();
                });

                return wrap;
            }
        });

        storeMap.addControl(new ZoomSlider());

        // 지도 내 위치 이동 버튼
        const LocateControl = L.Control.extend({
            options: { position: 'topright' },
            onAdd: function() {
                const btn = L.DomUtil.create('button', 'map-locate-btn');
                btn.type = 'button';
                btn.innerHTML = '⌖';
                btn.title = '내 위치로 이동';
                btn.setAttribute('aria-label', '내 위치로 이동');

                L.DomEvent.disableClickPropagation(btn);
                L.DomEvent.disableScrollPropagation(btn);

                L.DomEvent.on(btn, 'click', function(e) {
                    L.DomEvent.stop(e);

                    // 기존 GPS 좌표가 있으면 즉시 지도 이동
                    if (myLat !== null && myLon !== null) {
                        storeMap.stop();
                        storeMap.invalidateSize();
                        storeMap.setView(
                            [Number(myLat), Number(myLon)],
                            17,
                            {animate: false}
                        );
                        return;
                    }

                    alert('위치 정보가 없습니다. 상단의 내 위치 사용 버튼을 눌러주세요.');
                });

                
                return btn;
            }
        });

        storeMap.addControl(new LocateControl());
    }


    // 내 위치와 선택한 검색 반경 표시
    if (rangeCircle) {
        storeMap.removeLayer(rangeCircle);
        rangeCircle = null;
    }
    if (myMapMarker) {
        storeMap.removeLayer(myMapMarker);
        myMapMarker = null;
    }

    if (myLat !== null && myLon !== null) {
        myMapMarker = L.circleMarker([myLat, myLon], {
            radius: 7,
            color: '#ffffff',
            weight: 3,
            fillColor: '#2563eb',
            fillOpacity: 1
        }).addTo(storeMap).bindPopup('내 위치');

        const km = Number($('radius').value);

        if (km > 0) {
            rangeCircle = L.circle([myLat, myLon], {
                radius: km * 1000,
                color: '#3b82f6',
                weight: 2,
                fillColor: '#3b82f6',
                fillOpacity: 0.12,
                dashArray: '6, 4'
            }).addTo(storeMap);
        }
    }

    storeMarkers.clearLayers();
    storeMarkerByBiz = {};

    const bounds = [];

    for (const x of list) {
        const lat = Number(x.lat);
        const lon = Number(x.lon);

        if (!Number.isFinite(lat) || !Number.isFinite(lon) ||
            lat < 33 || lat > 39 || lon < 124 || lon > 132) {
            continue;
        }

        const color = x.stockStatus !== 'known'
            ? '#888888'
            : x.quantity > 0 ? '#22c55e' : '#ef4444';

        const stockText = x.stockStatus !== 'known'
            ? '수량 미확인'
            : x.quantity > 0 ? '재고 ' + x.quantity + '개' : '품절 (0개)';

        const markerText = x.stockStatus !== 'known'
            ? '?'
            : String(x.quantity);

        const marker = L.marker([lat, lon], {
            icon: L.divIcon({
                className: 'stock-number-marker',
                html: '<div style="' +
                    'background:' + color + ';' +
                    'color:white;' +
                    'border:2px solid white;' +
                    'border-radius:50%;' +
                    'width:34px;height:34px;' +
                    'display:flex;align-items:center;justify-content:center;' +
                    'font-size:13px;font-weight:700;' +
                    'box-shadow:0 2px 6px #0005;' +
                    '">' + markerText + '</div>',
                iconSize: [38, 38],
                iconAnchor: [19, 19],
                popupAnchor: [0, -19]
            })
        });

        /* V9 MARKER NAVER ROUTE 133 */
        marker.bindPopup(
            '<div class="map-store-popup">' +
                '<b>' + E(x.name) + '</b>' +
                '<div class="map-popup-address">' + E(x.address || '') + '</div>' +
                '<strong class="map-popup-stock">' + E(stockText) + '</strong>' +
                '<button type="button" class="naver-walk-btn" ' +
                    'data-route-biz="' + E(String(x.bizNo)) + '">' +
                    '🚶 네이버 길안내' +
                '</button>' +
            '</div>'
        );

        marker.addTo(storeMarkers);
        storeMarkerByBiz[String(x.bizNo)] = marker;
        bounds.push([lat, lon]);
    }

    // 최초 조회 시에만 지도 위치 자동 조정
    if (!mapInitialViewDone) {
        if (rangeCircle) {
            storeMap.fitBounds(rangeCircle.getBounds(), {
                padding: [25, 25],
                maxZoom: 14
            });
            mapInitialViewDone = true;
        } else if (bounds.length) {
            storeMap.fitBounds(bounds, {
                padding: [25, 25],
                maxZoom: 14
            });
            mapInitialViewDone = true;
        }
    }

    $('mapInfo').textContent =
        '지도에 표시된 매장: ' + bounds.length + '개';

    setTimeout(() => storeMap.invalidateSize(), 0);
}

<script>
/* V9 PUSH AUTO SYNC 135-6-15 */
let pushSyncTimer135 = null;

async function syncPushFavorites135() {
  const subscription = window.emart24PushSubscription;

  if (!subscription) return;
  if (typeof getFavorites !== 'function') return;
  if (myLat == null || myLon == null) return;

  const radius = Number(document.getElementById('radius')?.value);

  if (!Number.isFinite(radius) || radius <= 0) return;

  const products = getFavorites()
    .filter(product => isFavoriteAlertEnabled(product.plu))
    .map(product => ({
      plu: String(product.plu),
      name: String(product.name)
    }));

  try {
    const response = await fetch('/api/push/watch', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        subscription: subscription.toJSON(),
        products,
        latitude: myLat,
        longitude: myLon,
        radius
      })
    });

    if (!response.ok) {
      throw new Error('HTTP ' + response.status);
    }

    console.log('푸시 즐겨찾기 동기화 완료:', products.length);
  } catch (error) {
    console.warn('푸시 즐겨찾기 동기화 실패:', error);
  }
}

function schedulePushSync135() {
  clearTimeout(pushSyncTimer135);
  pushSyncTimer135 = setTimeout(syncPushFavorites135, 1200);
}
</script>

<div id="pushButton135" style="position:fixed;right:16px;bottom:90px;z-index:9999">
  <button type="button" id="enablePush135"
    style="border:0;border-radius:24px;padding:12px 16px;background:#e1306c;color:white;font-weight:700;box-shadow:0 4px 16px #0003;cursor:pointer">
    🔔 휴대폰 알림 켜기
  </button>

<script>
(function(){
  const button = document.getElementById('enablePush135');

  if (!('serviceWorker' in navigator) || !('Notification' in window)) {
    button.textContent = '알림 미지원 브라우저';
    button.disabled = true;
    return;
  }

  if (Notification.permission === 'granted') {
    button.textContent = '🔔 알림 권한 허용됨';
  }

  button.addEventListener('click', async () => {
    if (!window.isSecureContext) {
      alert('푸시 알림은 HTTPS 환경에서 사용할 수 있습니다.');
      return;
    }

    try {
      const registration = await navigator.serviceWorker.register('/sw.js');
      const permission = await Notification.requestPermission();

      if (permission === 'granted') {
        // V9 PUSH SUBSCRIBE 135-6-9
        const keyResponse = await fetch('/api/push/public-key');
        if (!keyResponse.ok) throw new Error('VAPID 공개키 조회 실패');

        const { publicKey } = await keyResponse.json();

        const padding = '='.repeat((4 - publicKey.length % 4) % 4);
        const base64 = (publicKey + padding)
          .replace(/-/g, '+').replace(/_/g, '/');

        const raw = atob(base64);
        const applicationServerKey = Uint8Array.from(
          raw, character => character.charCodeAt(0)
        );

        let subscription = await registration.pushManager.getSubscription();

        if (!subscription) {
          subscription = await registration.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey
          });
        }

        window.emart24PushSubscription = subscription;

        // V9 PUSH SEND SUBSCRIPTION 135-6-11
        const saveResponse = await fetch('/api/push/subscribe', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(subscription.toJSON())
        });

        if (!saveResponse.ok) {
          throw new Error('푸시 구독 서버 저장 실패: ' + saveResponse.status);
        }

        // V9 PUSH WATCH SYNC 135-6-14
        const watchProducts = getFavorites()
          .filter(product => isFavoriteAlertEnabled(product.plu))
          .map(product => ({
            plu: String(product.plu),
            name: String(product.name)
          }));

        const watchRadius = Number(document.getElementById('radius').value);

        if (myLat === null || myLon === null || watchRadius <= 0) {
          button.textContent = '🔔 푸시 구독 저장됨';
          alert('푸시 구독은 저장되었습니다. 상품 입고 알림을 등록하려면 내 위치를 설정하고 검색 반경을 선택해 주세요.');
          return;
        }

        const watchResponse = await fetch('/api/push/watch', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({
            subscription: subscription.toJSON(),
            products: watchProducts,
            latitude: myLat,
            longitude: myLon,
            radius: watchRadius
          })
        });

        if (!watchResponse.ok) {
          throw new Error('알림 대상 등록 실패: ' + watchResponse.status);
        }

        const watchResult = await watchResponse.json();

        button.textContent = '🔔 푸시 알림 등록됨';
        alert('푸시 알림 대상 상품 ' + watchResult.watchCount + '개가 등록되었습니다.');
      } else {
        button.textContent = '🔕 알림 권한 미허용';
      }
    } catch (error) {
      console.error('푸시 알림 준비 실패:', error);
      alert('알림 설정 중 오류가 발생했습니다.');
    }
  });
})();
</script>

<script>
/* V9 PUSH SYNC STABILITY 135-6-18 */
(function() {
  let previousSettings = '';

  function getSettingsSnapshot() {
    try {
      return JSON.stringify({
        favorites: getFavorites(),
        alerts: getFavoriteAlerts(),
        latitude: typeof myLat !== 'undefined' ? myLat : null,
        longitude: typeof myLon !== 'undefined' ? myLon : null,
        radius: document.getElementById('radius')?.value
      });
    } catch (error) {
      return '';
    }
  }

  previousSettings = getSettingsSnapshot();

  setInterval(() => {
    const currentSettings = getSettingsSnapshot();

    if (!currentSettings || currentSettings === previousSettings) {
      return;
    }

    previousSettings = currentSettings;

    if (typeof schedulePushSync135 === 'function') {
      schedulePushSync135();
    }
  }, 1500);

  console.log('즐겨찾기 푸시 설정 변경 감지 활성화');
})();
</script>
