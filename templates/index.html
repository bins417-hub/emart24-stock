<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이마트24 재고조회 v6</title>
<style>
*{box-sizing:border-box}
:root{
  --bg:#080a0c;
  --panel:#0f1215;
  --panel2:#15191e;
  --panel3:#1b2026;
  --line:#252b32;
  --text:#f5f6f7;
  --muted:#89919c;
  --yellow:#ffd522;
  --green:#18e36b;
  --green-bg:#082b18;
  --red:#ff5058;
  --red-bg:#321013;
}
html{background:var(--bg)}
body{
  margin:0;
  color:var(--text);
  background:
    radial-gradient(circle at 50% -150px,#1a2026 0,#080a0c 420px);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased;
}
.w{
  width:100%;
  max-width:760px;
  margin:0 auto;
  padding:18px 13px 60px;
}
.c{
  background:linear-gradient(145deg,#101419,#0c0f12);
  border:1px solid var(--line);
  border-radius:24px;
  padding:20px;
  margin-bottom:13px;
}
h1{
  margin:0 0 5px;
  font-size:27px;
  letter-spacing:-1.2px;
}
h1 span{
  color:var(--yellow)!important;
  font-size:11px!important;
  border:1px solid #423b13;
  background:#211e0d;
  padding:5px 8px;
  border-radius:20px;
  vertical-align:middle;
}
h2{
  margin:0 0 15px;
  font-size:19px;
  letter-spacing:-.6px;
}
.row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:8px;
}
input,select,button{
  min-height:48px;
  border-radius:14px;
  border:1px solid var(--line);
  background:var(--panel2);
  color:var(--text);
  font-family:inherit;
  font-size:15px;
  padding:0 14px;
  outline:none;
}
input::placeholder{color:#6f7781}
input:focus,select:focus{border-color:#5d6570}
input{flex:1;min-width:150px}
select{color-scheme:dark}
button{
  background:var(--yellow);
  color:#111;
  border-color:var(--yellow);
  font-weight:800;
  cursor:pointer;
}
button:active{transform:scale(.98)}
.secondary{
  color:#c9ced4;
  background:var(--panel2);
  border-color:var(--line);
}
.active{
  background:var(--yellow);
  color:#111;
  border-color:var(--yellow);
}
#locationBtn{
  background:var(--panel3);
  color:var(--yellow);
  border:1px solid #414852;
}
#refreshBtn{
  background:var(--panel3);
  color:#fff;
  border-color:#343b44;
}
#locmsg,#msg{margin:10px 2px 0}
.muted{
  color:var(--muted);
  font-size:12px;
  line-height:1.5;
}
.p{
  position:relative;
  margin:9px 0;
  padding:17px 42px 17px 16px;
  border-radius:17px;
  border:1px solid var(--line);
  background:linear-gradient(145deg,#15191e,#101317);
  cursor:pointer;
}
.p:after{
  content:"›";
  position:absolute;
  right:17px;
  top:50%;
  transform:translateY(-50%);
  font-size:30px;
  color:#68717d;
}
.p:active{
  border-color:var(--yellow);
  transform:scale(.995);
}
.p b{
  display:block;
  font-size:16px;
  margin-bottom:4px;
}
#summary{
  margin:14px 0 4px;
  padding:12px 13px;
  background:#11151a;
  border:1px solid #20262d;
  border-radius:13px;
}
.store{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
  margin-top:10px;
  padding:16px;
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(145deg,#13171c,#0e1114);
}
.store>div:first-child{
  flex:1;
  min-width:0;
}
.store b{
  font-size:16px;
  letter-spacing:-.4px;
}
.store .muted{
  display:block;
  margin-top:4px;
}
.qty{
  flex:none;
  min-width:88px;
  padding:10px 11px;
  border-radius:13px;
  text-align:center;
  font-weight:900;
  white-space:nowrap;
}
.yes{
  color:var(--green);
  background:var(--green-bg);
  border:1px solid #0d7137;
  font-size:17px;
}
.zero{
  color:#c3c8ce;
  background:#1a1f25;
  border:1px solid #303740;
  font-size:13px;
}
.unknown{
  color:#b8bec6;
  background:#1a1f25;
  border:1px solid #303740;
  font-size:12px;
}
.dist{
  display:inline-block;
  margin-top:7px;
  padding:4px 7px;
  border-radius:8px;
  background:#20252c;
  color:#aeb5be;
  font-size:12px;
  font-weight:700;
}
.change{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  align-items:center;
  margin-top:8px;
  font-size:12px;
}
.up{
  padding:4px 7px;
  border-radius:8px;
  color:var(--green);
  background:var(--green-bg);
  font-weight:900;
}
.down{
  padding:4px 7px;
  border-radius:8px;
  color:var(--red);
  background:var(--red-bg);
  font-weight:900;
}
.live{
  color:var(--green);
  font-size:12px;
  font-weight:900;
}
.live:not(:empty):before{
  content:"● ";
}
.radius-wrap{
  display:flex;
  width:100%;
  gap:6px;
  margin-top:2px;
  overflow-x:auto;
  scrollbar-width:none;
}
.radius-wrap::-webkit-scrollbar{display:none}
.radius-btn{
  min-width:64px;
  min-height:43px;
  padding:0 13px;
  flex:1 0 auto;
  border-radius:13px;
}
.radius-btn.active{
  background:var(--yellow);
  color:#111;
  border-color:var(--yellow);
}

}

#restockToast{position:fixed;top:18px;left:50%;transform:translate(-50%,-130px);z-index:9999;width:calc(100% - 28px);max-width:520px;box-sizing:border-box;padding:15px 17px;border-radius:17px;background:rgba(12,28,18,.97);border:1px solid rgba(74,222,128,.55);box-shadow:0 15px 45px rgba(0,0,0,.55);color:#fff;opacity:0;pointer-events:none;transition:.3s ease;font-size:14px}#restockToast.show{transform:translate(-50%,0);opacity:1}#restockToast strong{display:block;color:#4ade80;font-size:15px;margin-bottom:4px}

<body>

<div class="w">

<div class="c">

<script>
const $=id=>document.getElementById(id);
const E=s=>String(s??'').replace(/[&<>"']/g,m=>({
'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
}[m]));

let stores=[];
let filter='all';
let myLat=null;
let myLon=null;
let selectedProduct=null;
let timer=null;
let previousQty={};
let changeStats={};
let lastRefresh=null;

function km(lat1,lon1,lat2,lon2){
    const R=6371,rad=x=>x*Math.PI/180;
    const dLat=rad(lat2-lat1);
    const dLon=rad(lon2-lon1);
    const a=Math.sin(dLat/2)**2+
        Math.cos(rad(lat1))*Math.cos(rad(lat2))*
        Math.sin(dLon/2)**2;
    return 2*R*Math.asin(Math.sqrt(a));
}

function getLocation(){
    if(!navigator.geolocation){
        $('locmsg').textContent='이 브라우저는 위치 기능을 지원하지 않습니다.';
        return;
    }

    $('locmsg').textContent='현재 위치 확인 중...';

    navigator.geolocation.getCurrentPosition(
        p=>{
            myLat=p.coords.latitude;
            myLon=p.coords.longitude;
            $('locmsg').textContent='현재 위치를 적용했습니다.';
            render();
        },
        ()=>{
            $('locmsg').textContent='위치 권한을 허용하지 않았거나 위치를 가져오지 못했습니다.';
        },
        {enableHighAccuracy:true,timeout:10000}
    );
}

async function search(){
    $('msg').textContent='검색 중...';

    try{
        const r=await fetch('/api/products?q='+encodeURIComponent($('q').value));
        const d=await r.json();

        if(!r.ok){
            $('msg').textContent='오류: '+d.detail;
            return;
        }

        $('pl').innerHTML='';

        d.products.forEach(p=>{
            const x=document.createElement('div');
            x.className='p';
            x.innerHTML=
                '<b>'+E(p.name)+'</b>'+
                '<div class="muted">상품코드 '+E(p.plu)+' / '+E(p.price)+'</div>';

            x.addEventListener('click',()=>selectProduct(p));
            $('pl').appendChild(x);
        });

        $('pb').style.display='block';
        $('msg').textContent=d.products.length+'개 상품';
    }catch(e){
        $('msg').textContent='검색 중 오류가 발생했습니다.';
    }
}

function selectProduct(p){
    selectedProduct=p;

    previousQty={};
    changeStats={};

    $('rb').style.display='block';
    $('title').textContent=p.name+' · 매장별 재고';

    loadInventory(false);
}

async function loadInventory(isAuto=false){
    if(!selectedProduct) return;

    if(!isAuto) $('sl').textContent='조회 중...';

    const p=selectedProduct;

    const u='/api/inventory?plu='+
        encodeURIComponent(p.plu)+
        '&area1='+encodeURIComponent($('a1').value)+
        '&area2='+encodeURIComponent($('a2').value);

    try{
        const r=await fetch(u);
        const d=await r.json();

        if(!r.ok){
            $('liveStatus').textContent='조회 오류';
            if(!isAuto) $('sl').textContent='오류: '+d.detail;
            return;
        }

        updateChanges(d.stores);

        stores=d.stores;
        lastRefresh=new Date();

        sync();
        render();
    }catch(e){
        $('liveStatus').textContent='조회 실패';
    }
}

let toastTimer=null;

function showRestockToast(store,delta){
    const el=$('restockToast');
    el.innerHTML='<strong>🔥 새 입고 감지!</strong>'+
        E(store.name)+' · +'+delta+'개 · 현재 '+store.quantity+'개';
    el.classList.add('show');

    if(toastTimer) clearTimeout(toastTimer);
    toastTimer=setTimeout(()=>el.classList.remove('show'),5000);
}

function updateChanges(newStores){
    const now=new Date();

    newStores.forEach(x=>{
        if(x.stockStatus!=='known') return;

        const key=x.bizNo;
        const current=Number(x.quantity);

        if(!(key in changeStats)){
            changeStats[key]={
                up:0,
                down:0,
                lastChange:null,
                lastDelta:0
            };
        }

        if(key in previousQty){
            const old=previousQty[key];
            const delta=current-old;

            if(delta>0){
                changeStats[key].up+=delta;
                changeStats[key].lastDelta=delta;
                changeStats[key].lastChange=now;
                showRestockToast(x,delta);
            }else if(delta<0){
                changeStats[key].down+=Math.abs(delta);
                changeStats[key].lastDelta=delta;
                changeStats[key].lastChange=now;
            }
        }

        previousQty[key]=current;
    });
}

function setFilter(v){
    filter=v;
    sync();
    render();
}

function sync(){
    $('allBtn').className=filter==='all'?'active':'secondary';
    $('stockBtn').className=filter==='stock'?'active':'secondary';
    $('restockBtn').className=filter==='restock'?'active':'secondary';
}

function distanceOf(x){
    if(myLat===null||myLon===null||!x.lat||!x.lon) return null;
    return km(myLat,myLon,Number(x.lat),Number(x.lon));
}

function render(){
    let a=[...stores];

    if(filter==='stock'){
        a=a.filter(x=>x.stockStatus==='known'&&x.quantity>0);
    }

    if(filter==='restock'){
        const cutoff=Date.now()-(24*60*60*1000);
        a=a.filter(x=>x.lastRestock && new Date(x.lastRestock).getTime()>=cutoff && x.stockStatus==='known' && x.quantity>0);
        a.sort((x,y)=>new Date(y.lastRestock)-new Date(x.lastRestock));
    }

    const radius=Number($('radius').value);

    if(radius>0){
        if(myLat===null||myLon===null){
            $('locmsg').textContent='반경 검색을 사용하려면 먼저 내 위치 사용을 눌러주세요.';
        }else{
            a=a.filter(x=>{
                const d=distanceOf(x);
                return d!==null&&d<=radius;
            });
        }
    }

    if(filter==='restock'){
        a.sort((x,y)=>new Date(y.lastRestock)-new Date(x.lastRestock));
    }
    else if($('sort').value==='qty'){
        a.sort((x,y)=>(y.quantity??-1)-(x.quantity??-1));
    }
    else if($('sort').value==='distance'){
        if(myLat===null){
            $('locmsg').textContent='먼저 내 위치 사용 버튼을 눌러주세요.';
            $('sort').value='qty';
            a.sort((x,y)=>(y.quantity??-1)-(x.quantity??-1));
        }else{
            a.sort((x,y)=>(distanceOf(x)??99999)-(distanceOf(y)??99999));
        }
    }
    else{
        a.sort((x,y)=>x.name.localeCompare(y.name,'ko'));
    }

    const positive=a.filter(
        x=>x.stockStatus==='known'&&x.quantity>0
    ).length;

    const zero=a.filter(
        x=>x.stockStatus==='known'&&x.quantity===0
    ).length;

    const unknown=a.filter(
        x=>x.stockStatus==='unknown'
    ).length;

    $('statTotal').textContent=a.length;
    $('statStock').textContent=positive;
    $('statZero').textContent=zero;
    $('statUnknown').textContent=unknown;

    let summaryText='실시간 재고 현황';

    if(lastRefresh){
        summaryText+=' · 마지막 조회 '+
            lastRefresh.toLocaleTimeString('ko-KR',{
                hour:'2-digit',
                minute:'2-digit',
                second:'2-digit'
            });
    }

    $('summary').textContent=summaryText;

    if(!a.length){
        $('sl').innerHTML='<p>조건에 맞는 매장이 없습니다.</p>';
        return;
    }

    $('sl').innerHTML=a.map(x=>{
        let t,c;

        if(x.stockStatus==='unknown'){
            t='수량 미확인';
            c='unknown';
        }else if(x.quantity>0){
            t='재고 '+x.quantity+'개';
            c='yes';
        }else{
            t='품절 (0개)';
            c='zero';
        }

        const d=distanceOf(x);

        const ds=d===null?'':(
            '<div class="dist">현재 위치에서 약 '+
            (d<1?Math.round(d*1000)+'m':d.toFixed(1)+'km')+
            '</div>'
        );

        const st=changeStats[x.bizNo];

        let change='';

        if(st){
            const parts=[];

            if(st.up>0){
                parts.push('<span class="up">▲ 증가 +'+st.up+'</span>');
            }

            if(st.down>0){
                parts.push('<span class="down">▼ 감소 -'+st.down+'</span>');
            }

            if(st.lastChange){
                parts.push(
                    '<span class="muted">최근 변동 '+
                    st.lastChange.toLocaleTimeString('ko-KR',{
                        hour:'2-digit',
                        minute:'2-digit',
                        second:'2-digit'
                    })+
                    '</span>'
                );
            }

            if(parts.length){
                change='<div class="change">'+parts.join(' · ')+'</div>';
            }
        }

        let restock='';
        if(x.lastRestock){
            const rt=new Date(x.lastRestock);
            const mins=Math.max(0,Math.floor((Date.now()-rt.getTime())/60000));
            let ago=mins<1?'방금':mins<60?mins+'분 전':Math.floor(mins/60)+'시간 전';
            restock='<div class="restock">🔥 최근 입고 · '+ago+
                ' · '+x.fromQty+' → '+x.toQty+'개 · ▲ +'+x.lastIncrease+
                '</div>';
        }

        return '<div class="store">'+
            '<div>'+
                '<b>'+E(x.name)+'</b>'+
                '<div class="muted">'+E(x.address)+'</div>'+
                ds+
                restock+
                change+
            '</div>'+
            '<div class="qty '+c+'">'+E(t)+'</div>'+
        '</div>';
    }).join('');
}

function setAutoRefresh(){
    if(timer){
        clearInterval(timer);
        timer=null;
    }

    const sec=Number($('interval').value);

    if(sec<=0){
        $('liveStatus').textContent='';
        return;
    }

    $('liveStatus').textContent='● 자동조회 '+sec+'초';

    timer=setInterval(()=>{
        loadInventory(true);
    },sec*1000);
}

$('searchBtn').addEventListener('click',search);

$('q').addEventListener('keydown',e=>{
    if(e.key==='Enter') search();
});

$('locationBtn').addEventListener('click',getLocation);

$('allBtn').addEventListener('click',()=>setFilter('all'));
$('stockBtn').addEventListener('click',()=>setFilter('stock'));
$('restockBtn').addEventListener('click',()=>setFilter('restock'));

$('sort').addEventListener('change',render);
document.querySelectorAll('.radius-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
        $('radius').value=btn.dataset.radius;

        document.querySelectorAll('.radius-btn').forEach(x=>{
            x.className='radius-btn secondary';
        });

        btn.className='radius-btn active';

        if(Number(btn.dataset.radius)>0 && (myLat===null||myLon===null)){
            $('locmsg').textContent='반경 검색을 사용하려면 먼저 내 위치 사용을 눌러주세요.';
        }

        render();
    });
});
document.querySelectorAll('.interval-btn').forEach(btn=>{btn.addEventListener('click',()=>{$('interval').value=btn.dataset.sec;document.querySelectorAll('.interval-btn').forEach(x=>x.className='interval-btn secondary');btn.className='interval-btn active';setAutoRefresh();});});

$('refreshBtn').addEventListener('click',()=>{
    loadInventory(false);
});

setAutoRefresh();
</script>
